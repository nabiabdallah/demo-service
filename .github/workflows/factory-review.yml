name: Factory review

# An independent review of every pull request from a branch of this repository, and auto-merge of the low-risk
# ones (claude-factory ADRs 0027 and 0033). Runs when CI passes on a pull request, or by hand with its number.
#   pick     no secrets: which pull request, is it reviewed (open, not a draft, this repo, base main: any tier),
#            may it merge by itself (also risk:low by its paths now)
#   review   the Claude credential only: a fresh code-reviewer (the pinned plugin's brief) with read-only tools
#            on a checkout of the head, which nothing runs
#   comment  the workflow's token: posts the review on the pull request, replacing this workflow's earlier one
#   merge    a risk:low pull request with an APPROVE only: re-checks the sha, the tier and the required checks,
#            then merges as the factory's App when the repository has its key (so the push to main starts CI),
#            else with the workflow's token
# A risk:high pull request (every feature) is reviewed and never merged here: you merge it, with the review on it.
# Secrets: CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY; optional FACTORY_APP_KEY with FACTORY_APP_CLIENT_ID.
# Variables: FACTORY_PAUSED (true stops reviews and merges), FACTORY_MAX_BUDGET_USD (default 25).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions:
  contents: read

concurrency:
  group: factory-review-${{ github.event.workflow_run.head_sha || inputs.pr }}
  cancel-in-progress: false

jobs:
  pick:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.pick.outputs.review }}
      low: ${{ steps.pick.outputs.low }}
      tier: ${{ steps.pick.outputs.tier }}
      pr: ${{ steps.pick.outputs.pr }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Which pull request, is it reviewed, may it merge by itself
        id: pick
        run: .github/scripts/risk-tier.sh pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          FACTORY_PAUSED: ${{ vars.FACTORY_PAUSED }}

  review:
    needs: pick
    if: needs.pick.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      # The trusted side: this script, the CLI pin and the plugin pin come from the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The pull request's head, read-only data for the reviewer: nothing in it is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pick.outputs.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Claude Code CLI and fetch the reviewer's brief
        run: .github/scripts/risk-tier.sh tools

      - name: Independent review of the final diff
        id: review
        run: .github/scripts/risk-tier.sh review
        env:
          PR: ${{ needs.pick.outputs.pr }}
          SHA: ${{ needs.pick.outputs.sha }}
          TIER: ${{ needs.pick.outputs.tier }}
          PR_DIR: ${{ github.workspace }}/pr
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_MAX_BUDGET_USD: ${{ vars.FACTORY_MAX_BUDGET_USD }}

      - name: Keep the review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-review
          path: ${{ runner.temp }}/risk-tier/review.md
          if-no-files-found: ignore

  comment:
    needs: [pick, review]
    if: needs.review.result == 'success' && needs.review.outputs.verdict != '' && needs.review.outputs.verdict != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write # PR comments go through the issues API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-review
          path: ${{ runner.temp }}/handoff

      - name: Post the review on the pull request
        run: .github/scripts/risk-tier.sh comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.pick.outputs.pr }}
          FACTORY_HANDOFF: ${{ runner.temp }}/handoff

  merge:
    needs: [pick, review]
    if: needs.pick.outputs.low == 'true' && needs.review.outputs.verdict == 'approve'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      FACTORY_APP: ${{ secrets.FACTORY_APP_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint an App token
        id: app
        if: env.FACTORY_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID || secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Re-check the sha, the tier and the required checks, then merge
        run: .github/scripts/risk-tier.sh merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          PR: ${{ needs.pick.outputs.pr }}
          SHA: ${{ needs.pick.outputs.sha }}
          VERDICT: ${{ needs.review.outputs.verdict }}
          FACTORY_PAUSED: ${{ vars.FACTORY_PAUSED }}
