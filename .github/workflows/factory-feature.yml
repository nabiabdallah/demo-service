name: Factory feature

# Unattended factory runs (claude-factory ADRs 0018 and 0019), started by a label on an issue, or dispatched
# with an issue number and that label (factory-chain.yml does that when a spec is approved, ADR 0026):
#   factory:spec    the issue describes an idea. The java-pipeline `intake` skill drafts a spec and the run ends in
#                   a pull request that adds it. Merging it with "- Status: Approved" approves the spec and
#                   starts its build.
#   factory:build   the issue names an approved spec on the default branch (docs/specs/NNNN-name.md in its text, or
#                   the "spec drafted" comment of an earlier factory:spec run). The `new-feature` skill builds it
#                   and the run ends in a pull request that closes the issue. You review and merge.
#
# Four jobs, so nothing the agent touched runs with a token that can write (claude-factory ADR 0023):
#   agent    no token that can write; the Claude credential. Hands over a git bundle of its commits and its report.
#   gate     a fresh checkout of the default branch, read-only token: checks the bundle, runs ./mvnw verify.
#   publish  a fresh checkout again, the write token, builds nothing: pushes the commit the gate verified.
#   report   tells the issue why a run stopped.
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY; FACTORY_PACKAGES_TOKEN (as CI).
# For CI to start on the run's pull request (GitHub starts none on one opened with the workflow's own token): the
# factory's GitHub App installed on this repository, with FACTORY_APP_KEY (secret) and FACTORY_APP_CLIENT_ID
# (variable or secret); claude-factory's provisioning sets them (ADR 0028). Or FACTORY_PR_TOKEN, a fine-grained
# token for this repository (Contents, Pull requests and Issues: read and write). With neither, the pull request
# is opened with the workflow's token and needs a close and reopen. Optional variable: FACTORY_MAX_BUDGET_USD
# (default 25).
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number"
        required: true
      label:
        description: "What to do with the issue"
        required: true
        type: choice
        options: ['factory:build', 'factory:spec']

permissions:
  contents: read

# One run per issue at a time; a second label waits instead of cancelling a run that is mid-change.
concurrency:
  group: factory-run-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'factory:build' || github.event.label.name == 'factory:spec'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read # who may start a run; the spec named in comments
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      branch: ${{ steps.resolve.outputs.branch }}
      base: ${{ steps.resolve.outputs.base }}
      base_branch: ${{ steps.resolve.outputs.base_branch }}
      spec: ${{ steps.resolve.outputs.spec }}
      why: ${{ steps.failed.outputs.why }}
      at: ${{ steps.failed.outputs.at }}
    env:
      ISSUE_NUMBER: ${{ inputs.issue || github.event.issue.number }}
      FACTORY_LABEL: ${{ inputs.label || github.event.label.name }}
    steps:
      # The default branch: the spec the agent builds is the one the owner merged, never text from the issue.
      # No credentials are left in the checkout, so the agent can't push or call the GitHub API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: FACTORY_PACKAGES_TOKEN

      # Issue text reaches the script through the environment, never through the command line.
      - name: Who asked, what to do (draft a spec or build an approved one), which plugin release
        id: resolve
        run: .github/scripts/factory-run.sh resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Install the pinned Claude Code CLI and the pinned java-pipeline plugin
        run: .github/scripts/factory-run.sh tools

      - name: Run the skill (intake for a spec; spec → plan → review → tests → code → verify → review for a build)
        run: .github/scripts/factory-run.sh agent
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_PACKAGES_TOKEN: ${{ secrets.FACTORY_PACKAGES_TOKEN }}
          FACTORY_MAX_BUDGET_USD: ${{ vars.FACTORY_MAX_BUDGET_USD }}

      - name: Hand over the commits (git bundle) and the report
        run: .github/scripts/factory-run.sh pack

      - name: Say why the run stopped
        id: failed
        if: failure()
        run: .github/scripts/factory-run.sh failed

      - name: Keep the hand-over and the agent's result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-run
          path: |
            ${{ runner.temp }}/factory-run/agent.bundle
            ${{ runner.temp }}/factory-run/report.md
            ${{ runner.temp }}/factory-run/agent.json
            ${{ runner.temp }}/factory-run/failure
          if-no-files-found: ignore

  gate:
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # no token that can write: this job builds the agent's code
    outputs:
      head: ${{ steps.gate.outputs.head }}
      why: ${{ steps.failed.outputs.why }}
      at: ${{ steps.failed.outputs.at }}
    env:
      ISSUE_NUMBER: ${{ inputs.issue || github.event.issue.number }}
      FACTORY_MODE: ${{ needs.agent.outputs.mode }}
      FACTORY_BRANCH: ${{ needs.agent.outputs.branch }}
      FACTORY_BASE: ${{ needs.agent.outputs.base }}
      FACTORY_BASE_BRANCH: ${{ needs.agent.outputs.base_branch }}
      FACTORY_SPEC: ${{ needs.agent.outputs.spec }}
    steps:
      # The base commit, not the agent's tree: the script that gates runs here is the one the owner merged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.agent.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: FACTORY_PACKAGES_TOKEN

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-run
          path: ${{ runner.temp }}/handoff

      # Once the bundle is checked out, the tree is the agent's: run this script from a copy outside it.
      # ($RUNNER_TEMP, not ${{ runner.temp }} in job-level env: GitHub rejects the runner context there.)
      - name: Keep the runner outside the tree the agent wrote
        run: cp .github/scripts/factory-run.sh "$RUNNER_TEMP/trusted-runner.sh"

      - name: Check the bundle on the base
        run: '"$RUNNER_TEMP/trusted-runner.sh" unpack'

      - name: "Gate (spec: one complete spec file, nothing else; build: protected files untouched, ./mvnw verify green)"
        id: gate
        run: '"$RUNNER_TEMP/trusted-runner.sh" gate'
        env:
          FACTORY_PACKAGES_TOKEN: ${{ secrets.FACTORY_PACKAGES_TOKEN }}

      - name: Say why the run stopped
        id: failed
        if: failure()
        run: '"$RUNNER_TEMP/trusted-runner.sh" failed'

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-run
          path: |
            ${{ runner.temp }}/factory-run/verify.log
            ${{ runner.temp }}/factory-run/failure
          if-no-files-found: ignore

  publish:
    needs: [agent, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the feature branch
      pull-requests: write # open the pull request
      issues: write # report on the issue
    outputs:
      why: ${{ steps.failed.outputs.why }}
      at: ${{ steps.failed.outputs.at }}
    env:
      ISSUE_NUMBER: ${{ inputs.issue || github.event.issue.number }}
      FACTORY_MODE: ${{ needs.agent.outputs.mode }}
      FACTORY_BRANCH: ${{ needs.agent.outputs.branch }}
      FACTORY_BASE: ${{ needs.agent.outputs.base }}
      FACTORY_BASE_BRANCH: ${{ needs.agent.outputs.base_branch }}
      FACTORY_SPEC: ${{ needs.agent.outputs.spec }}
      FACTORY_GATED_SHA: ${{ needs.gate.outputs.head }}
      FACTORY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FACTORY_APP: ${{ secrets.FACTORY_APP_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.agent.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-run
          path: ${{ runner.temp }}/handoff

      # Once the bundle is checked out, the tree is the agent's: run this script from a copy outside it.
      - name: Keep the runner outside the tree the agent wrote
        run: cp .github/scripts/factory-run.sh "$RUNNER_TEMP/trusted-runner.sh"

      - name: Check the bundle on the base again (nothing is built here)
        run: |
          "$RUNNER_TEMP/trusted-runner.sh" unpack
          "$RUNNER_TEMP/trusted-runner.sh" gate
        env:
          FACTORY_GATE_BUILD: '0'

      # A token for this repository only, as the factory's App: a pull request opened with it starts CI.
      - name: Mint an App token
        id: app
        if: env.FACTORY_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID || secrets.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}

      - name: Push the branch and open the pull request
        run: '"$RUNNER_TEMP/trusted-runner.sh" publish'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.FACTORY_PR_TOKEN || github.token }}
          FACTORY_PR_STARTS_CI: ${{ steps.app.outputs.token != '' || secrets.FACTORY_PR_TOKEN != '' }}

      - name: Say why the run stopped
        id: failed
        if: failure()
        run: '"$RUNNER_TEMP/trusted-runner.sh" failed'

  report:
    needs: [agent, gate, publish]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # tell the issue
    env:
      ISSUE_NUMBER: ${{ inputs.issue || github.event.issue.number }}
      FACTORY_WHY: ${{ needs.agent.outputs.why || needs.gate.outputs.why || needs.publish.outputs.why }}
      FACTORY_AT: ${{ needs.agent.outputs.at || needs.gate.outputs.at || needs.publish.outputs.at }}
      FACTORY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The default branch: trusted code only. The reason arrives as text in the environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tell the issue why the run stopped
        run: .github/scripts/factory-run.sh report
        env:
          GH_TOKEN: ${{ github.token }}
