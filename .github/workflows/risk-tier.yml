name: Risk tier

# Labels each pull request risk:low or risk:high from its changed paths (claude-factory ADRs 0027 and 0033).
# pull_request_target so it can label pull requests from Dependabot and the factory's bot; it checks out the default
# branch, never the pull request's code, and reads only the pull request's metadata and file list from the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # labels are set through the issues API
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Classify from the changed paths and label
        run: .github/scripts/risk-tier.sh label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
