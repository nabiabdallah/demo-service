spring.application.name=demo-service

# Actuator on its own port (claude-factory ADR 0014): the app port serves only the API, so an ingress can't
# expose it. There: Kubernetes probes (/actuator/health/liveness|readiness, no internals) and Prometheus.
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# JSON logs (ECS) for log collectors. Plain text locally: run with the `local` profile.
logging.structured.format.console=ecs

# Let in-flight requests finish when the pod is stopped.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Metrics: Prometheus only (the OpenTelemetry starter's OTLP metrics push is off). Latency histograms for SLOs.
management.otlp.metrics.export.enabled=false
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Traces: OpenTelemetry over OTLP. No endpoint here, so local runs and tests export nothing; each overlay sets
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT and MANAGEMENT_TRACING_SAMPLING_PROBABILITY.
# config/ObservabilityConfig strips raw request URLs (they carry identifiers) from spans.
